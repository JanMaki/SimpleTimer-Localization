    lessDescription: |
      ◇가 ◆ 이하인지 아닌지를 성공 및 실패로 판정합니다
      예시 1： /roll 1d10<=2 1개 10면 주사위를 던진 결과가 2 이하인지 아닌지를 판정합니다 20%의 확률로 성공합니다
